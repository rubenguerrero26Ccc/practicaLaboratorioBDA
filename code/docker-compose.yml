services:
  # ---------------------------------------------------------------- HDFS
  namenode:
    image: apache/hadoop:3.4.0
    container_name: namenode
    hostname: namenode
    user: root
    command:
      - bash
      - -c
      - >
        if [ ! -d /hadoop/dfs/name/current ]; then
        hdfs namenode -format -nonInteractive -force;
        fi;
        hdfs namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    env_file:
      - ./hadoop/hadoop.env
    environment:
      HDFS_NAMENODE_USER: root
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - bigdata

  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"
    env_file:
      - ./hadoop/hadoop.env
    environment:
      HDFS_DATANODE_USER: root
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - bigdata

  # --------------------------------------------------------------- Spark
  spark-master:
    image: bitnamilegacy/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    env_file:
      - ./spark/spark.env
    environment:
      SPARK_MODE: master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata

  spark-worker:
    image: bitnamilegacy/spark:3.5.0
    container_name: spark-worker
    hostname: spark-worker
    env_file:
      - ./spark/spark.env
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - bigdata

  # --------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    user: root
    ports:
      - "9092:9092"   # acceso desde otros contenedores (kafka:9092)
      - "9094:9094"   # acceso desde tu máquina (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata

  # ------------------------------------------------------------- MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigdata

  # ------------------------------------------------------------ Postgres
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bigdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata

  # ------------------------------------------------------------- Jupyter
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter
    hostname: jupyter
    command: start-notebook.py --IdentityProvider.token=''
    ports:
      - "8888:8888"
      - "4040:4040"   # Spark UI del driver
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      - spark-master
      - kafka
      - mongodb
      - postgres
      - namenode
    networks:
      - bigdata

  # ------------------------------------------------------------ Anaconda
  anaconda:
    image: continuumio/anaconda3:latest
    container_name: anaconda
    hostname: anaconda
    command: >
      bash -c "apt-get update &&
      apt-get install -y --no-install-recommends default-jre-headless &&
      pip install pyspark==3.5.0 kafka-python pymongo psycopg2-binary hdfs &&
      mkdir -p /opt/notebooks &&
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token='' --ServerApp.password=''
      --notebook-dir=/opt/notebooks"
    ports:
      - "8889:8888"
      - "4041:4040"   # Spark UI del driver
    volumes:
      - ./notebooks_anaconda:/opt/notebooks
    depends_on:
      - spark-master
      - kafka
      - mongodb
      - postgres
      - namenode
    networks:
      - bigdata

  # --------------------------------------------------------------- MySQL
  mysql:
    image: mysql:8
    container_name: mysql
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/ventas_db.sql:/docker-entrypoint-initdb.d/ventas_db.sql
    networks:
      - bigdata
      
volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  mongodb_data:
  postgres_data:

networks:
  bigdata:
    driver: bridge